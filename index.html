<!DOCTYPE html>
<html lang="en">
<head>
    <!-- [All your existing head content unchanged] -->
    <style>
        /* [All your existing CSS] */

        /* New: For single film view */
        body.single-film-view .film-carousel,
        body.single-film-view .film-dots,
        body.single-film-view h3 {
            display: none !important;
        }

        body.single-film-view .main-viewer {
            max-width: 1200px;
            margin: 0 auto;
            height: 80vh;
        }

        .back-to-portfolio {
            position: absolute;
            top: 100px;
            left: 40px;
            z-index: 10;
            background: rgba(0,0,0,0.7);
            padding: 10px 20px;
            border-radius: 4px;
            color: #fff;
            text-decoration: none;
            font-weight: bold;
        }

        .back-to-portfolio:hover {
            background: #E50914;
        }

        @media (max-width: 768px) {
            .back-to-portfolio {
                top: 80px;
                left: 20px;
                padding: 8px 16px;
                font-size: 0.9em;
            }

            body.single-film-view .main-viewer {
                height: 60vh;
            }
        }
    </style>
</head>
<body>
    <!-- [All your existing body content unchanged] -->

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        // --- DATA ---
        const filmData = [
            { id: 1, title: "The Victorias - Editor's Cut", slug: "the-victorias", logline: "Alexia Anthony, a former Tenement Museum actor, reflects on the impact of her role as a fourteen-year-old Sephardic immigrant in 1916. Based on Ethan Fuirst’s documentary, The Victorias, for The New Yorker magazine.", role: "Editor", thumb: "https://f004.backblazeb2.com/file/tefub-films/thumbs/the_victorias.png", video: "https://f004.backblazeb2.com/file/tefub-films/films/The_Victorias.mp4", passwordProtected: true },
            { id: 2, title: "Diary of Cecelia Stone", slug: "diary-of-cecelia-stone", logline: "Cecelia recalls memories of her and Ethan, her lover, as she mourns his death. Inspired by Frank O’Hara’s poem, Having A Coke With You.", role: "Writer, Storyboarder, Director, Cinematographer, Editor", thumb: "https://f004.backblazeb2.com/file/tefub-films/thumbs/diary_of_cecelia_stone.png", video: "https://f004.backblazeb2.com/file/tefub-films/films/Diary_of_Cecelia_Stone.mp4", passwordProtected: false },
            { id: 3, title: "Higher Living", slug: "higher-living", logline: "After interfering with a radio tower, an alien fanatic believes she’s made contact with aliens, dragging her reluctant roommate along for a long hike. In their ensuing quest to film the supernatural, they rekindle their old friendship.", role: "Cinematographer, Storyboarder, Editor", thumb: "https://f004.backblazeb2.com/file/tefub-films/thumbs/higher_living.png", video: "https://f004.backblazeb2.com/file/tefub-films/films/Higher_Living.mp4", passwordProtected: false },
            { id: 4, title: "Lucky Fish - Editor's Cut", slug: "lucky-fish", logline: "What starts off as a brief restroom conversation quickly turns into a budding romance between Maggie and Celine. Based on Emily Jampel’s short film, Lucky Fish.", role: "Editor", thumb: "https://f004.backblazeb2.com/file/tefub-films/thumbs/lucky_fish.png", video: "https://f004.backblazeb2.com/file/tefub-films/films/Lucky_Fish.mp4", passwordProtected: true },
            { id: 5, title: "9-5", slug: "9-5", logline: "A busy, but telling, morning routine of a working class couple.", role: "Writer, Storyboarder, Director, Cinematographer, Editor", thumb: "https://f004.backblazeb2.com/file/tefub-films/thumbs/9-5.png", video: "https://f004.backblazeb2.com/file/tefub-films/films/9-5.mp4", passwordProtected: false },
            { id: 6, title: "This Is Life", slug: "this-is-life", logline: "A compilation of clips from the internet reveal the dichotomy that spans every area of life. Inspired by the visual artist, Ugur Gallenkus.", role: "Editor", thumb: "https://f004.backblazeb2.com/file/tefub-films/thumbs/this_is_life.png", video: "https://f004.backblazeb2.com/file/tefub-films/films/This_is_Life.mp4", passwordProtected: false },
            { id: 7, title: "Love Dive", slug: "love-dive", logline: "Ive's Love Dive dance cover by the Krush Dance Crew.", role: "Editor", thumb: "https://f004.backblazeb2.com/file/tefub-films/thumbs/love_dive.jpg", video: "https://f004.backblazeb2.com/file/tefub-films/films/Love_Dive.mp4", passwordProtected: false }
        ];

        const REQUIRED_PASSWORD = "tefu2025"; // Change this!

        function checkPassword() {
            if (sessionStorage.getItem('filmAccessGranted') === 'true') return true;
            const input = prompt("This film is password protected. Please enter the password:");
            if (input === REQUIRED_PASSWORD) {
                sessionStorage.setItem('filmAccessGranted', 'true');
                return true;
            } else if (input !== null) {
                alert("Incorrect password.");
                return false;
            }
            return false;
        }

        // --- URL HANDLING FOR DIRECT FILM ACCESS ---
        const path = window.location.pathname;
        const singleFilmMatch = path.match(/^\/film\/([^\/]+)$/);
        let initialIndex = 0;

        if (singleFilmMatch) {
            const slug = singleFilmMatch[1];
            const film = filmData.find(f => f.slug === slug);
            if (film) {
                initialIndex = filmData.indexOf(film);
                document.body.classList.add('single-film-view');

                // Add back button
                const backBtn = document.createElement('a');
                backBtn.href = '/';
                backBtn.className = 'back-to-portfolio';
                backBtn.textContent = '← Back to Portfolio';
                document.querySelector('#filmography').prepend(backBtn);
            } else {
                // Invalid slug → redirect to main portfolio
                window.location.href = '/#filmography';
            }
        }

        // --- FILMOGRAPHY SETUP ---
        const mainViewerVideo = document.getElementById('main-viewer-video');
        const viewerTitle = document.getElementById('viewer-title');
        const viewerLogline = document.getElementById('viewer-logline');
        const viewerDescription = document.getElementById('viewer-description');
        const viewerPlayIcon = document.getElementById('viewer-play-icon');
        const filmCarouselTrack = document.getElementById('film-carousel-track');
        const filmDots = document.getElementById('film-dots');
        const modalVideoPlayer = document.getElementById('modalVideoPlayer');
        const videoModal = document.querySelector('.video-modal');

        let currentFilmIndex = initialIndex;

        function updateViewer(index, shouldScroll = true) {
            const item = filmData[index];
            currentFilmIndex = index;

            if (item.passwordProtected && !sessionStorage.getItem('filmAccessGranted')) {
                mainViewerVideo.poster = item.thumb;
                mainViewerVideo.src = "";
                mainViewerVideo.load();
                viewerTitle.textContent = item.title;
                viewerLogline.textContent = item.logline;
                viewerDescription.textContent = "This film is password protected.";
            } else {
                mainViewerVideo.poster = item.thumb;
                mainViewerVideo.src = item.video;
                mainViewerVideo.load();
                viewerTitle.textContent = item.title;
                viewerLogline.textContent = item.logline;
                viewerDescription.textContent = `Role: ${item.role}`;
            }

            // In single view, no need for selected states
            if (!document.body.classList.contains('single-film-view')) {
                document.querySelectorAll('.carousel-thumbnail').forEach(thumb => {
                    thumb.classList.toggle('selected', parseInt(thumb.dataset.index) === index);
                });
                document.querySelectorAll('.film-dot').forEach((dot, i) => {
                    dot.classList.toggle('active', i === index);
                });
                if (shouldScroll) scrollToThumbnail(index);
            }
        }

        function scrollToThumbnail(index) {
            // Only used in full carousel view
        }

        // Build thumbnails only in full portfolio view
        if (!document.body.classList.contains('single-film-view')) {
            filmData.forEach((item, index) => {
                const thumbDiv = document.createElement('div');
                thumbDiv.className = 'carousel-thumbnail';
                thumbDiv.style.backgroundImage = `url(${item.thumb})`;
                thumbDiv.dataset.index = index;
                thumbDiv.innerHTML = `<i class="fas fa-play play-icon"></i>`;

                const previewHandler = () => {
                    if (item.passwordProtected && !checkPassword()) {
                        updateViewer(index);
                        return;
                    }
                    updateViewer(index, false);
                };
                thumbDiv.addEventListener('mouseenter', previewHandler);
                thumbDiv.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    previewHandler();
                }, { passive: false });

                thumbDiv.addEventListener('click', () => {
                    if (item.passwordProtected && !checkPassword()) return;
                    mainViewerVideo.muted = true;
                    modalVideoPlayer.src = item.video;
                    videoModal.style.display = 'flex';
                    modalVideoPlayer.play();
                });

                filmCarouselTrack.appendChild(thumbDiv);

                const dot = document.createElement('span');
                dot.className = 'film-dot';
                dot.addEventListener('click', () => {
                    if (item.passwordProtected && !checkPassword()) {
                        updateViewer(index);
                        return;
                    }
                    updateViewer(index);
                });
                filmDots.appendChild(dot);
            });
        }

        viewerPlayIcon.addEventListener('click', () => {
            const item = filmData[currentFilmIndex];
            if (item.passwordProtected && !checkPassword()) return;
            mainViewerVideo.muted = true;
            modalVideoPlayer.src = item.video;
            videoModal.style.display = 'flex';
            modalVideoPlayer.play();
        });

        // Initial load
        updateViewer(initialIndex);

        // [Rest of your script (home reel, photography, modals, etc.) remains unchanged]
        // ... (all the code from previous version for observer, modals, home video, photography, etc.)
    });
    </script>
</body>
</html>
